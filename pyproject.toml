[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "yominpost"
version = "0.1.0"
description = "Self-hosted AI social media studio: turn one piece of material into platform-native posts, check them for account risk, schedule and publish. Web app + CLI + MCP server + agent skill."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Yomin Ma", email = "mrlong0129@users.noreply.github.com" }]
keywords = ["social-media", "content-generation", "scheduler", "postiz-alternative", "mcp", "ai-agent", "claude-code", "cursor", "fastapi", "self-hosted"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Office/Business",
]
dependencies = [
  "pydantic>=2.5,<3.0",
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.29,<1.0",
  "jinja2>=3.1,<4.0",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.9",
  "cryptography>=43,<46",
  "Pillow>=10,<12",
  "mcp>=1.2",  # v1 (FastMCP) and v2 (MCPServer) both supported
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
yominpost = "yominpost.cli:main"
yominpost-mcp = "yominpost.mcp_server:main"

[project.urls]
Homepage = "https://yomin.love/projects/yominpost/"
Repository = "https://github.com/mrlong0129/yominpost"

[tool.hatch.build.targets.wheel]
packages = ["yominpost"]
exclude = ["yominpost/data", "yominpost/artifacts"]

[tool.hatch.build.targets.sdist]
exclude = ["yominpost/data", "yominpost/artifacts", ".venv", ".claude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
